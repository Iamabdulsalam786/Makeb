<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="makcomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="60%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="makcomAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric Modern Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer stylized M shield -->
    <path d="M6 46 L6 14 L24 34 L42 14 L42 46 L34 46 L34 26 L24 37 L14 26 L14 46 Z" fill="url(#makcomGrad)" />
    <!-- Dynamic forward accent wedge -->
    <path d="M44 26 L52 18 L52 34 Z" fill="url(#makcomAccent)" />
    <!-- Pulse dot -->
    <circle cx="24" cy="46" r="3" fill="#E11D48" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <g transform="translate(74, 16)">
    <!-- Brand Name -->
    <text x="0" y="27" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" letter-spacing="0.04em" fill="#FFFFFF">
      MAK<tspan fill="#E11D48">COM</tspan>
    </text>
    <!-- Subtitle / Positioning -->
    <text x="1" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" letter-spacing="0.22em" fill="#94A3B8">
      CONSULTING • TECHNOLOGY • SOLUTIONS
    </text>
  </g>
</svg>
